<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Name Tag</title>

  <!-- Bubbly font -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <form id="orderForm" class="screen">

    <h1>Create Name Tag</h1>
    <p class="subtitle">Make it yours ✨</p>

    <div class="section">
      <label>Your Name</label>
      <input type="text" name="name" placeholder="Type your name..." required>
    </div>

    <div class="section">
      <label>Name Tag Text</label>
      <input type="text" name="tagText" placeholder="What should it say?" required>
    </div>

    <div class="section">
      <label>Colors</label>

      <div class="color-pill">
        <span>Color 1</span>
        <input type="color" name="color1" value="#000000">
      </div>

      <div class="color-pill">
        <span>Color 2</span>
        <input type="color" name="color2" value="#ffffff">
      </div>

      <div class="color-pill">
        <span>Color 3</span>
        <input type="color" name="color3" value="#c2a97f">
      </div>

      <div id="extraColors"></div>

      <button type="button" id="addColorBtn" class="add-btn">
        + Add color
      </button>
    </div>

    <div class="section">
      <label>Description</label>
      <textarea name="description" placeholder="Optional details..."></textarea>
    </div>

    <button type="submit" class="submit">Submit</button>

  </form>
</div>

<script src="script.js"></script>
</body>
</html>
